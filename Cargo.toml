[package]
name = "hevy-mcp-server"
version = "1.1.0"
edition = "2024"
description = "MCP server for Hevy fitness API"
license = "MIT"

[dependencies]
mcp-server = "0.1"
mcp-spec = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
serde_path_to_error = "0.1"
serde_with = "3"
axum = "0.7"
bytes = "1"
tower-service = "0.3"
dashmap = "6"
chacha20poly1305 = "0.10"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
uuid = { version = "1.7", features = ["v4", "fast-rng"] }
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.3"
http = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
